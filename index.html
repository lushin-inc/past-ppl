<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dan Faber - Outreach Progress</title>
<script>
  // Set theme before first paint (defaults to dark)
  (function () {
    var t = 'dark';
    try { t = localStorage.getItem('outreach-theme') || 'dark'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   DAILY UPDATE: change the "done" numbers below and optionally add names.
   type "prep" rows show on the Prep tab, "contact" rows on the Contact
   tab, "goal" rows on the Dashboard only. prepTitle is the card title
   on the Prep tab.
   Days left updates on its own from today's date.
   ===================================================================== */
const DAYS = [
  { day: "Mon", date: "2026-10-19" },
  { day: "Tue", date: "2026-10-20" },
  { day: "Wed", date: "2026-10-21" },
  { day: "Thu", date: "2026-10-22" },
  { day: "Fri", date: "2026-10-23" }
];

const GOALS = [
  {
    title: "Past contacts",
    prepTitle: "Pick 10 Contacts",
    grad: ["#E34554", "#F05A28"],
    rows: [
      { type: "prep",    label: "10 LS Contacts", target: 10, done: 10, names: [] },
      { type: "contact", label: "Contact them",                target: 10, done: 0, names: [] }
    ]
  },
  {
    title: "Where are they now",
    prepTitle: "Pick 10 WATN",
    grad: ["#F05A28", "#FAB040"],
    rows: [
      { type: "prep",    label: "10 WATN", target: 10, done: 10, names: [] },
      { type: "contact", label: "Contact them",                       target: 10, done: 4, names: [] }
    ]
  },
  {
    title: "LinkedIn cold outreach",
    prepTitle: "Pick 10 People",
    grad: ["#0045C2", "#00ADED"],
    rows: [
      { type: "prep",    label: "10 People", target: 10, done: 0, names: [] },
      { type: "contact", label: "Reach out on LinkedIn",        target: 10, done: 0, names: [] }
    ]
  },
  {
    title: "2 LinkedIn Posts",
    prepTitle: "Write LinkedIn Post",
    grad: ["#3A40A8", "#E34554"],
    rows: [
      { type: "prep",    label: "Write Post",       target: 2,  done: 1, names: [] },
      { type: "contact", label: "Post once a week", target: 2,  done: 1, names: [] }
    ]
  },
  {
    title: "2 Referrals Sent",
    prepTitle: "Find 2 Referrals",
    grad: ["#FAB040", "#00ADED"],
    rows: [
      { type: "prep",    label: "Find 2 referrals to send", target: 2, done: 1, names: [] },
      { type: "contact", label: "Send them",                target: 2, done: 1, names: [] }
    ]
  },
  {
    title: "Talks",
    grad: ["#3A40A8", "#00ADED"],
    rows: [
      { type: "goal",    label: "2 Talks Booked in October", target: 2, done: 0, names: [] }
    ]
  }
];

/* LINKS: each group gets a header on the Links tab. To add a link,
   add one { label, url } line inside the group it belongs to. */
const LINKS = [
  {
    group: "This Week",
    links: [
      { label: "Prospecting This Week", url: "https://app.notion.com/p/danfaber/3f922e1a1007804480caebf453bf6730?v=3f922e1a100780e6b7d5000c7be631a4&source=copy_link" },
      { label: "Top 10 Prospects",      url: "https://lushin-inc.github.io/top/" },
      { label: "Cookbook",              url: "https://docs.google.com/spreadsheets/d/1ODeo3ZsnnJ0VfNHYKrzq4SWZpL3COnVhyn9YaQ4E-3E/edit?usp=drivesdk" }
    ]
  },
  {
    group: "Past Contacts",
    links: [
      { label: "LS Clients - Sheets",   url: "https://docs.google.com/spreadsheets/d/1Bn-O28hvfgVQhp9EkDw51_sz0XyxwYtYcYHU6MeeHds/edit?gid=119484984#gid=119484984" },
      { label: "Past Contacts",         url: "https://lushin-inc.github.io/past-ppl" },
      { label: "Past Contacts Notion",  url: "https://app.notion.com/p/danfaber/e46cd534a6d649f2be5ce5a25b716032?v=243bda9c5fc042e4a6668e3d49211ee3&source=copy_link" },
      { label: "LS Calls",              url: "https://app.notion.com/p/danfaber/3df22e1a100780aeb446c0570cbabdf0?v=3df22e1a100780bd8ce2000c26658efc&source=copy_link" },
      { label: "Talk Tracks",           url: "https://lushin-inc.github.io/talk-trax-la" }
    ]
  },
  {
    group: "WATN",
    links: [
      { label: "WATN (Past Clients)",   url: "https://app.notion.com/p/danfaber/Past-Clients-3fd22e1a10078095b63ad84998e1badf?source=copy_link" }
    ]
  },
  {
    group: "LinkedIn",
    links: [
      { label: "Sales Navigator",       url: "https://www.linkedin.com/sales/home" },
      { label: "ZoomInfo",              url: "https://app.zoominfo.com/" }
    ]
  },
  {
    group: "Talks",
    links: [
      { label: "Talks Contacts",        url: "https://app.notion.com/p/danfaber/3e522e1a100780449b7afadbdf8f6c90?v=3e522e1a10078080bc83000c08c59af7&source=copy_link" }
    ]
  }
];

const DAYS_GRAD = ["#00ADED", "#0045C2"];
</script>
<style>
  :root {
    --stable: #21245C;
    --fresh: #00ADED;
    --font: 'Poppins', Arial, sans-serif;

    --bg: #ffffff;
    --card: #f6f6f9;
    --empty: #e2e3ea;
    --track: #EDEDED;
    --heading: #21245C;
    --text: #333333;
    --soft: #6b6d8a;
    --tabs-bg: #f0f0f4;
    --tab-active-bg: #21245C;
    --tab-active-text: #ffffff;
    --chip: #ffffff;
    --empty-label: #8a8ca8;
    --link: #0045C2;
  }
  :root[data-theme="dark"] {
    --bg: #0e0f26;
    --card: #181a3d;
    --empty: #282b58;
    --track: #282b58;
    --heading: #ffffff;
    --text: #d6d8ee;
    --soft: #8d90b8;
    --tabs-bg: #181a3d;
    --tab-active-bg: #ffffff;
    --tab-active-text: #21245C;
    --chip: #282b58;
    --empty-label: #7b7fa8;
    --link: #a9bdf0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    transition: background .25s ease, color .25s ease;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }
  header { margin-bottom: 28px; }
  .head-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  .who {
    font-size: 15px;
    font-weight: 300;
    color: var(--heading);
    opacity: .8;
  }
  h1 {
    font-size: 30px;
    font-weight: 500;
    color: var(--heading);
    margin-top: 2px;
  }

  .theme-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 0;
    background: var(--card);
    color: var(--heading);
    display: grid;
    place-items: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .theme-btn svg { width: 20px; height: 20px; }
  .theme-btn .ico-sun { display: none; }
  :root[data-theme="dark"] .theme-btn .ico-sun { display: block; }
  :root[data-theme="dark"] .theme-btn .ico-moon { display: none; }
  .theme-btn:focus-visible { outline: 3px solid var(--fresh); outline-offset: 2px; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-top: 22px;
    padding: 4px;
    background: var(--tabs-bg);
    border-radius: 999px;
    width: fit-content;
    max-width: 100%;
  }
  .tab {
    font-family: var(--font);
    font-size: 15px;
    font-weight: 500;
    color: var(--soft);
    background: transparent;
    border: 0;
    border-radius: 999px;
    padding: 9px 22px;
    cursor: pointer;
    transition: background .2s ease, color .2s ease;
  }
  .tab:hover { color: var(--heading); }
  .tab.active { background: var(--tab-active-bg); color: var(--tab-active-text); }
  .tab:focus-visible { outline: 3px solid var(--fresh); outline-offset: 2px; }

  .overall {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .overall-track {
    flex: 1;
    height: 10px;
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
  }
  .overall-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--stable), var(--fresh));
    transition: width .6s ease;
  }
  :root[data-theme="dark"] .overall-fill { background: linear-gradient(90deg, #0045C2, var(--fresh)); }
  .overall-num {
    font-size: 15px;
    font-weight: 500;
    color: var(--heading);
    white-space: nowrap;
  }

  section {
    padding: 30px 28px 32px;
    border-radius: 20px;
    background: var(--card);
    margin-bottom: 20px;
  }
  .sec-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }
  .sec-num {
    width: 34px; height: 34px;
    border-radius: 50%;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .sec-num svg { width: 17px; height: 17px; }
  h2 {
    font-size: 21px;
    font-weight: 500;
    color: var(--heading);
  }
  .sec-head .count { margin-left: auto; }

  .row + .row { margin-top: 24px; }
  .row-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 10px;
  }
  .label { font-size: 16px; font-weight: 400; color: var(--text); }
  .count {
    font-size: 16px;
    font-weight: 600;
    color: var(--heading);
    white-space: nowrap;
  }
  .count .of { font-weight: 300; color: var(--soft); }
  .count.done {
    color: #fff;
    padding: 3px 14px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .count.done .of { color: #fff; opacity: .85; }
  .count svg { width: 14px; height: 14px; }

  .bar {
    display: grid;
    height: 46px;
    border-radius: 12px;
    overflow: hidden;
  }
  .cell {
    border-left: 5px solid var(--card);
    background: transparent;
    display: grid;
    place-items: center;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
  }
  .cell:first-child { border-left: 0; }
  .cell.empty { background: var(--empty); color: var(--empty-label); font-weight: 500; }
  .cell.today {
    background: var(--empty);
    color: var(--fresh);
    box-shadow: inset 0 0 0 2px var(--fresh);
    border-radius: 0;
  }
  .cell svg { width: 16px; height: 16px; }
  .cell-in { display: inline-flex; align-items: center; gap: 6px; }
  .bar.complete { box-shadow: 0 6px 22px -6px var(--glow); }
  .bar.labeled { height: 52px; }
  .bars { display: grid; gap: 8px; }

  .names {
    list-style: none;
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .names li {
    font-size: 13px;
    color: var(--heading);
    background: var(--chip);
    padding: 4px 12px;
    border-radius: 999px;
  }

  .link-groups { display: flex; flex-direction: column; gap: 34px; }
  .link-group h3 {
    font-size: 18px;
    font-weight: 600;
    color: var(--heading);
    margin-bottom: 10px;
  }
  .link-row {
    display: flex;
    flex-wrap: wrap;
    column-gap: 30px;
    row-gap: 2px;
    margin-left: -6px;
  }
  .link-row a {
    font-size: 18px;
    font-weight: 400;
    color: var(--link);
    text-decoration: none;
    padding: 8px 6px;
    border-radius: 8px;
    transition: color .15s ease;
  }
  .link-row a:hover { color: var(--fresh); text-decoration: underline; text-underline-offset: 4px; }
  .link-row a:focus-visible { outline: 3px solid var(--fresh); outline-offset: 0; }

  @media (max-width: 520px) {
    .link-row { column-gap: 22px; }
    .link-row a { font-size: 17px; }
    .wrap { padding: 36px 16px 60px; }
    section { padding: 24px 18px 26px; }
    .bar { height: 38px; }
    .bar.labeled { height: 44px; }
    .label, .count { font-size: 15px; }
    .tab { padding: 8px 12px; font-size: 14px; }
    .cell { font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .overall-fill, body { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-top">
      <div>
        <div class="who">Dan Faber</div>
        <h1>Outreach Progress</h1>
      </div>
      <button class="theme-btn" id="themeBtn" aria-label="Toggle light and dark">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" data-view="all" role="tab">Dashboard</button>
      <button class="tab" data-view="prep" role="tab">Prep</button>
      <button class="tab" data-view="contact" role="tab">Contact</button>
      <button class="tab" data-view="links" role="tab">Links</button>
    </nav>
    <div class="overall" id="overall">
      <div class="overall-track"><div class="overall-fill" id="overallFill" style="width:0"></div></div>
      <div class="overall-num" id="overallNum"></div>
    </div>
  </header>
  <main id="goals"></main>
</div>

<script>
  const check = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
  const clockIco = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const gradOf = g => `linear-gradient(90deg, ${g[0]}, ${g[1]})`;

  function localToday() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function weeks() {
    const out = [];
    DAYS.forEach(d => {
      if (!out.length || d.day === 'Mon') out.push([]);
      out[out.length - 1].push(d);
    });
    return out;
  }
  const WEEKS = weeks().length;
  const COLS = Math.max(...weeks().map(w => w.length));
  const targetOf = r => (r.target != null ? r.target : (r.perWeek || 0) * WEEKS);

  function daysCard() {
    const today = localToday();
    const left = DAYS.filter(d => d.date >= today).length;
    const grad = gradOf(DAYS_GRAD);
    const bars = weeks().map(w => {
      const cells = w.map(d => {
        const cls = d.date < today ? '' : (d.date === today ? 'today' : 'empty');
        return `<div class="cell ${cls}">${d.day}</div>`;
      }).join('');
      return `<div class="bar labeled" style="grid-template-columns:repeat(${COLS},1fr);background:${grad}">${cells}</div>`;
    }).join('');
    const countText = left === 0 ? 'Done' : (left === 1 ? 'Last day' : `${left} days left`);
    const count = left === 0
      ? `<span class="count done" style="background:${grad}">${check}Done</span>`
      : `<span class="count">${countText}</span>`;
    return `
      <section>
        <div class="sec-head">
          <div class="sec-num" style="background:${grad}">${clockIco}</div>
          <h2>Days left</h2>
          ${count}
        </div>
        <div class="bars">${bars}</div>
      </section>`;
  }

  function linksCard() {
    const groups = LINKS.map(g => {
      const links = g.links.map(l =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('');
      return `<div class="link-group"><h3>${esc(g.group)}</h3><div class="link-row">${links}</div></div>`;
    }).join('');
    return `<section><div class="link-groups">${groups}</div></section>`;
  }

  function render(view) {
    setTabs(view);
    const overall = document.getElementById('overall');
    if (view === 'links') {
      overall.style.display = 'none';
      document.getElementById('goals').innerHTML = daysCard() + linksCard();
      return;
    }
    overall.style.display = '';
    let total = 0, doneAll = 0;
    const goals = GOALS.map((g, gi) => {
      const grad = gradOf(g.grad);
      const picked = g.rows.filter(r => view === 'all' || r.type === view);
      if (!picked.length) return '';
      const actionView = view === 'prep' && g.prepTitle && picked.length === 1;
      let headCount = '';
      const rows = picked.map(r => {
        const target = targetOf(r);
        const done = Math.max(0, Math.min(target, r.done));
        total += target; doneAll += done;
        const complete = done >= target;
        const cells = Array.from({length: target}, (_, i) =>
          `<div class="cell ${i < done ? '' : 'empty'}"></div>`).join('');
        const count = complete
          ? `<span class="count done" style="background:${grad}">${check}${done}<span class="of">&nbsp;/ ${target}</span></span>`
          : `<span class="count">${done}<span class="of"> / ${target}</span></span>`;
        const names = (r.names && r.names.length)
          ? `<ul class="names">${r.names.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : '';
        if (actionView) headCount = count;
        return `
          <div class="row">
            ${actionView ? '' : `<div class="row-top"><span class="label">${esc(r.label)}</span>${count}</div>`}
            <div class="bar ${complete ? 'complete' : ''}"
                 style="grid-template-columns:repeat(${target},1fr);background:${grad};--glow:${g.grad[1]}66">${cells}</div>
            ${names}
          </div>`;
      }).join('');
      return `
        <section>
          <div class="sec-head">
            <div class="sec-num" style="background:${grad}">${gi + 1}</div>
            <h2>${esc(actionView ? g.prepTitle : g.title)}</h2>
            ${headCount}
          </div>
          ${rows}
        </section>`;
    }).join('');

    document.getElementById('goals').innerHTML =
      daysCard() + goals;
    document.getElementById('overallNum').textContent = `${doneAll} of ${total}`;
    requestAnimationFrame(() => {
      document.getElementById('overallFill').style.width = (total ? doneAll / total * 100 : 0) + '%';
    });
  }

  function setTabs(view) {
    document.querySelectorAll('.tab').forEach(t => {
      const on = t.dataset.view === view;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', on);
    });
  }

  function viewFromHash() {
    const h = location.hash.replace('#', '');
    return ['prep', 'contact', 'links'].includes(h) ? h : 'all';
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    const v = t.dataset.view;
    history.replaceState(null, '', v === 'all' ? location.pathname : '#' + v);
    render(v);
  }));
  window.addEventListener('hashchange', () => render(viewFromHash()));

  document.getElementById('themeBtn').addEventListener('click', () => {
    const root = document.documentElement;
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('outreach-theme', next); } catch (e) {}
  });

  render(viewFromHash());
</script>
</body>
</html>
